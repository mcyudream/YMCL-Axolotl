name: Publish completed platform
description: Upload verified platform assets and make them available without waiting for other builds.
runs:
  using: composite
  steps:
    - name: Upload verified release assets
      shell: bash
      run: gh release upload "${RELEASE_TAG:-$GITHUB_REF_NAME}" "${RUNNER_TEMP}/release-assets/"* --clobber
    - name: Make completed platform available
      shell: bash
      run: |
        tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
        if [[ "$tag" == *-* ]]; then
          gh release edit "$tag" --draft=false --prerelease --latest=false
        elif [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft')" == "true" ]]; then
          gh release edit "$tag" --draft=false --latest=false
        fi
