name: Axolotl desktop CI

on:
  push:
    branches: [main, ymcl-dev]
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  pull_request:
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axolotl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
          node scripts/axolotl/check-migrations.mjs --release
      - run: node scripts/axolotl/brand-guard.mjs
      - run: node scripts/axolotl/i18n-check.mjs
      - run: node scripts/axolotl/downgrade-app-db.test.mjs
      - run: node --test scripts/axolotl/build-pipeline.test.mjs scripts/axolotl/prepare-build-resources.test.mjs scripts/axolotl/package-portable.test.mjs
      - run: cargo fmt --all --check

  desktop:
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Replaces an sccache setup whose startup probe failed on every run:
      # the shared cache service rejected it, the enable step was skipped, and
      # Windows rebuilt the whole dependency tree uncached (~56 minutes).
      # Full-LTO release caches are warmed separately by prepare-release-cache.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: axolotl-rust-deps
          # A failing build still warms the cache for the next attempt.
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/replace-gradle-mirror
      - name: Cache frontend and Java build tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .turbo
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
            packages/app-lib/java/.cache
            .cache/build-resources/*.json
            packages/app-lib/java/build/libs
            apps/app/resources/blockbench-skin
            third-party/blockbench/dist/skin.bundle.js
          key: ${{ runner.os }}-${{ runner.arch }}-axolotl-build-tools-${{ hashFiles('pnpm-lock.yaml', 'packages/app-lib/java/**/*.kts', 'packages/app-lib/java/**/*.toml', 'packages/app-lib/java/**/*.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-axolotl-build-tools-${{ hashFiles('pnpm-lock.yaml', 'packages/app-lib/java/**/*.kts', 'packages/app-lib/java/**/*.toml', 'packages/app-lib/java/**/*.properties') }}-
            ${{ runner.os }}-${{ runner.arch }}-axolotl-build-tools-
      - run: pnpm exec turbo run build --filter=@modrinth/app-frontend
        env:
          TAURI_ENV_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}
      - name: Test native seed-map bridge
        run: cargo test --package axolotl-seed-map-native --locked
      - name: Test version metadata writes
        run: cargo test --package theseus writing_version_info_creates_missing_parent_directory
      - name: Test portable storage and Windows ZIP contents
        shell: pwsh
        run: |
          cargo test --package theseus --lib portable::
          if ($LASTEXITCODE -ne 0) { throw "Portable storage tests failed" }
          cargo test --package theseus --test portable_paths
          if ($LASTEXITCODE -ne 0) { throw "Portable directory move test failed" }
          node --test scripts/axolotl/package-portable.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Portable ZIP tests failed" }
      - run: cargo check --package ymcl_gui --features updater
      - name: Build modern Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @modrinth/app tauri build --config tauri-release.conf.json --config tauri-modern.conf.json
      - name: Verify modern Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one modern NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built modern installer: $($installers[0].Name)"
      - name: Bundle native NSIS Windows installer from the same binary
        if: runner.os == 'Windows'
        run: pnpm --filter @modrinth/app tauri bundle --config tauri-release.conf.json --config tauri-native.conf.json
      - name: Verify native NSIS Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one native NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built native NSIS installer: $($installers[0].Name)"
      - name: Package Windows portable edition from the same binary
        if: runner.os == 'Windows'
        run: node scripts/axolotl/package-portable.mjs
      - name: Upload Windows portable edition
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: YMCL-Windows-x64-portable
          path: target/release/bundle/portable/YMCL_*_x64_portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  website:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axolotl/website build
