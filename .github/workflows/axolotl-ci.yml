name: Axolotl desktop CI

on:
  push:
    branches: [ymcl-dev]
    paths-ignore:
      - '**/*.md'
      - 'apps/website/**'
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  pull_request:
    branches: [ymcl-dev]
    paths-ignore:
      - '**/*.md'
      - 'apps/website/**'
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axolotl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
      - run: node scripts/axolotl/brand-guard.mjs
      - run: node scripts/axolotl/i18n-check.mjs
      - run: node scripts/axolotl/downgrade-app-db.test.mjs
      - run: node --test scripts/axolotl/build-pipeline.test.mjs scripts/axolotl/prepare-build-resources.test.mjs scripts/axolotl/package-portable.test.mjs scripts/axolotl/release-platforms.test.mjs scripts/axolotl/validate-release-recovery.test.mjs scripts/axolotl/windows-release.test.mjs
      - run: cargo fmt --all --check

  desktop:
    needs: guardrails
    runs-on: windows-2025
    env:
      SQLX_OFFLINE: true
      CARGO_INCREMENTAL: '0'
      # Share dependency artifacts with releases instead of a separate cache-warming build.
      CARGO_PROFILE_RELEASE_LTO: 'thin'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive
      - uses: ./.github/actions/setup-release-build
        with:
          runner: windows-2025
      - name: Test native seed-map bridge
        run: cargo test --package axolotl-seed-map-native --locked
      - name: Test launcher storage and mod dependencies
        shell: bash
        run: |
          cargo test --package theseus --locked --lib portable::
          cargo test --package theseus --locked --test portable_paths
          cargo test --package theseus --locked --lib writing_version_info_creates_missing_parent_directory
          cargo test --package theseus --locked --lib mod_metadata::
          cargo test --package theseus --locked --lib content_snapshot::tests
          cargo test --package theseus --locked --lib content_rows::tests
          cargo test --package theseus --locked --lib api::instance::content::tests
          cargo test --package theseus --locked --lib imported_mrpack_members_keep_individual_content_updates
          cargo test --package theseus --locked --lib curseforge_content_updates_
          cargo test --package theseus --locked --lib curseforge_content_updates::tests
          cargo test --package theseus --locked --lib recognize_content_files::tests
          cargo test --package theseus --locked --lib content_refresh::tests
          cargo test --package theseus --locked --lib api::instance::export_mrpack::tests
      - name: Test Windows portable ZIP contents
        run: node --test scripts/axolotl/package-portable.test.mjs
      - name: Test mod dependency presentation
        working-directory: apps/app-frontend
        run: node --test src/helpers/content-dependencies.test.ts src/helpers/content-item-state.test.ts src/components/instance/dependencies/dependency-graph.test.ts src/components/ymcl/home/domain-home.test.ts src/components/ymcl/home/use-domain-home-carousel.test.ts
      - name: Test content update filtering
        working-directory: packages/ui
        run: node --test src/layouts/shared/content-tab/composables/content-pipeline.test.ts src/layouts/shared/content-tab/composables/content-filter-state.test.ts
      - name: Build and type-check desktop frontend
        run: pnpm exec turbo run build --filter=@modrinth/app-frontend
        env:
          TAURI_ENV_PLATFORM: windows
      - name: Check Windows desktop app
        # Reuse the test profile. Optimized binaries, installers and the WebView2
        # portable archive are produced only by the release workflow.
        run: cargo check --locked --package ymcl_gui --features updater
