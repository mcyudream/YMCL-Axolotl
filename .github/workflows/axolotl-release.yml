name: Axolotl release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to finish publishing
        required: true
        type: string
      source_run_id:
        description: Source release run with a verified successful Windows build
        required: false
        type: string
      rebuild:
        description: Rebuild an existing tag that has no published assets, with CI-only repairs
        required: false
        default: false
        type: boolean
      publish_only:
        description: Publish existing signed Windows assets without rebuilding
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: axolotl-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate existing release artifacts before recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PUBLISH_ONLY: ${{ inputs.publish_only && 'true' || 'false' }}
          REBUILD_RELEASE: ${{ inputs.rebuild && 'true' || 'false' }}
        run: node scripts/axolotl/validate-release-recovery.mjs

      - name: Require production build and publish secrets
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          YUDREAM_API_KEY: ${{ secrets.YUDREAM_API_KEY }}
        run: node scripts/axolotl/check-release-secrets.mjs

      - name: Read pinned Rust version
        id: rust-version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const version = readFileSync('rust-toolchain.toml', 'utf8').match(/^channel\s*=\s*"([^"]+)"/m)[1]
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`)
          NODE

      - name: Set up pinned Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run release guardrails
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/axolotl/check-migrations.mjs --release
          node scripts/axolotl/brand-guard.mjs
          node scripts/axolotl/i18n-check.mjs
          node --test scripts/axolotl/build-pipeline.test.mjs scripts/axolotl/prepare-build-resources.test.mjs scripts/axolotl/release-platforms.test.mjs scripts/axolotl/validate-release-recovery.test.mjs scripts/axolotl/windows-release.test.mjs
          rustc --edition=2024 --test packages/app-lib/build_env.rs -o "${RUNNER_TEMP}/curseforge-build-env-tests"
          "${RUNNER_TEMP}/curseforge-build-env-tests"
          cargo fmt --all --check

      - name: Compile production frontend before starting platform jobs
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Prepare draft release
        if: ${{ !inputs.publish_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="${RUNNER_TEMP}/axolotl-release-notes.md"
          node scripts/axolotl/create-release-notes.mjs "${RELEASE_TAG}" "$release_notes"
          existing_release="$(
            gh release list --limit 100 --json tagName \
              --jq ".[] | select(.tagName == \"${RELEASE_TAG}\") | .tagName"
          )"
          if [[ -n "$existing_release" ]]; then
            echo "Release ${RELEASE_TAG} already exists"
            gh release edit "${RELEASE_TAG}" --notes-file "$release_notes"
            exit 0
          fi

          release_args=(
            --draft
            --notes-file "$release_notes"
            --title "YMCL ${RELEASE_TAG}"
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${release_args[@]}"

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    if: github.event_name != 'workflow_dispatch' || inputs.rebuild
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            args: --config tauri-release.conf.json --config tauri-modern.conf.json --config tauri-updater.conf.json
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: true
      CARGO_INCREMENTAL: '0'
      # ThinLTO parallelizes Windows optimization; all installer variants reuse it.
      CARGO_PROFILE_RELEASE_LTO: 'thin'
      AXOLOTL_REQUIRE_CURSEFORGE_API_KEY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Restore release caches and prepare dependencies
        uses: ./.github/actions/setup-release-build
        with:
          runner: ${{ matrix.runner }}

      - name: Require LTO for published binaries
        shell: bash
        run: |
          case "${CARGO_PROFILE_RELEASE_LTO}" in
            true|thin) ;;
            *) echo "Release builds require LTO" >&2; exit 1 ;;
          esac

      - name: Set release version
        shell: bash
        run: |
          node scripts/axolotl/set-version.mjs "${RELEASE_TAG}"
          cargo update --workspace --offline

      - name: Build release assets
        id: package
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/app
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} -- --locked --timings
          generateReleaseNotes: false
          includeUpdaterJson: false
          updaterJsonPreferNsis: true
          retryAttempts: 2

      - name: Verify the production binary contains the CurseForge key
        shell: bash
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          binary="target/release/YMCL"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          node scripts/axolotl/verify-embedded-curseforge-key.mjs "$binary"

      - name: Stage release assets before rebundling
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.package.outputs.artifactPaths }}
        run: node scripts/axolotl/stage-release-assets.mjs "${RUNNER_TEMP}/release-assets"

      - name: Name the signed Windows modern installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $outDir = "target/release/bundle/nsis"
          $publishDir = Join-Path $env:RUNNER_TEMP "release-assets"

          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          $modernInstallers = @(Get-ChildItem $outDir -Filter '*-setup.exe' -File)
          if ($modernInstallers.Count -ne 1) {
            throw "Expected one modern installer, found $($modernInstallers.Count)"
          }

          $modernName = "YMCL_${version}_x64_modern-setup.exe"
          $modernPath = Join-Path $publishDir $modernName
          Copy-Item -Force $modernInstallers[0].FullName $modernPath
          Remove-Item (Join-Path $publishDir $modernInstallers[0].Name)

          $modernSignature = "$($modernInstallers[0].FullName).sig"
          if (Test-Path $modernSignature) {
            $modernSignaturePath = "$modernPath.sig"
            Copy-Item -Force $modernSignature $modernSignaturePath
            Remove-Item (Join-Path $publishDir "$($modernInstallers[0].Name).sig")
          }

      - name: Publish Windows installer and updater immediately
        if: runner.os == 'Windows'
        uses: ./.github/actions/publish-release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Windows distribution variants
        if: runner.os == 'Windows'
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $appName = "YMCL"
          $outDir = "target/release/bundle/nsis"
          $buildDir = "target/portable-build"
          $publishDir = Join-Path $env:RUNNER_TEMP "release-assets"

          pnpm --filter @modrinth/app tauri bundle --config tauri-release.conf.json --config tauri-native.conf.json
          if ($LASTEXITCODE -ne 0) { throw "Native NSIS bundling failed" }

          $nativeInstallers = @(Get-ChildItem $outDir -Filter '*-setup.exe' -File)
          if ($nativeInstallers.Count -ne 1) {
            throw "Expected one native NSIS installer, found $($nativeInstallers.Count)"
          }

          $nativeName = "YMCL_${version}_x64_nsis-setup.exe"
          $nativePath = Join-Path $publishDir $nativeName
          Copy-Item -Force $nativeInstallers[0].FullName $nativePath

          # Reuse the binary already built by tauri-action
          $appExe = "target/release/${appName}.exe"
          if (Test-Path $appExe) {
            New-Item -ItemType Directory -Force -Path "$buildDir\Axolotl" | Out-Null
            Copy-Item -Force $appExe "$buildDir\Axolotl\"

            # Create empty .Axolotl folder to trigger portable mode
            New-Item -ItemType Directory -Force -Path "$buildDir\Axolotl\.Axolotl" | Out-Null

            # Create portable zip (for manual download)
            $zipName = "YMCL_${version}_x64_portable.zip"
            $zipPath = Join-Path $publishDir $zipName
            Compress-Archive -Path "$buildDir\Axolotl" -DestinationPath $zipPath -Force
            Write-Output "Created portable zip: $zipPath"
          } else {
            throw "Binary not found at $appExe"
          }

      - name: Publish completed platform immediately
        uses: ./.github/actions/publish-release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-and-publish:
    name: Verify complete update and publish mirrors
    needs: [preflight, build]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && !inputs.rebuild && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    env:
      UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js for publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${RELEASE_TAG}" --pattern '*.sig' --dir release-check/signatures

      - name: Download release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases" \
              --paginate \
              --jq ".[] | select(.tag_name == \"${RELEASE_TAG}\") | .id"
          )"
          if [[ -z "$release_id" ]]; then
            echo "Release ${RELEASE_TAG} was not found"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release-check/release.json

      - name: Generate update manifest
        run: node scripts/axolotl/create-update-manifest.mjs release-check/release.json release-check/signatures "${RELEASE_TAG}" release-check/latest.json

      - name: Verify update manifest
        run: node scripts/axolotl/verify-update-manifest.mjs release-check/latest.json "${RELEASE_TAG}"

      - name: Upload update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" release-check/latest.json --clobber

      - name: Promote complete stable release to latest
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${RELEASE_TAG}" --latest

      - name: Build Update Server artifact catalog
        run: |
          node scripts/axolotl/create-update-server-catalog.mjs \
            release-check/release.json \
            "${RELEASE_TAG}" \
            release-check/update-server-catalog.json
          node scripts/axolotl/create-update-server-catalog.test.mjs

      - name: Upload and verify release on YuDream update platform
        env:
          YUDREAM_API_KEY: ${{ secrets.YUDREAM_API_KEY }}
        run: |
          node scripts/axolotl/publish-ymcl-platforms.mjs \
            release-check/update-server-catalog.json \
            release-check/release.json \
            release-check/signatures \
            "${RELEASE_TAG}"

      - name: Notify Update Server to publish release assets
        if: env.UPDATE_SERVER_URL != ''
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_SERVER_WEBHOOK_SECRET: ${{ secrets.UPDATE_SERVER_WEBHOOK_SECRET }}
          UPDATE_SERVER_FORCE_UPDATE: 'false'
        run: |
          node scripts/axolotl/publish-update-server.mjs \
            release-check/update-server-catalog.json \
            release-check/release.json \
            "${RELEASE_TAG}"

      - name: Publish website download metadata
        if: ${{ !contains(env.RELEASE_TAG, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "${DEFAULT_BRANCH}"
          git switch --create release-website-metadata "origin/${DEFAULT_BRANCH}"
          node scripts/axolotl/create-website-release-metadata.mjs \
            release-check/release.json \
            apps/website/releases/latest.json
          node scripts/axolotl/create-website-release-catalog.mjs \
            apps/website/releases/catalog.json

          git config user.name "Axolotl Release Bot"
          git config user.email "release@axolotl.local"
          git add apps/website/releases/latest.json apps/website/releases/catalog.json
          if git diff --cached --quiet; then
            echo "Website metadata is unchanged"
          else
            git commit -m "chore(website): update download metadata to ${RELEASE_TAG} [skip ci]"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi

      - name: Mirror published release to CNB
        if: env.CNB_TOKEN != ''
        env:
          CNB_REPO_URL_HTTPS: ${{ secrets.CNB_REPO_URL_HTTPS }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_TOKEN_USER_NAME: ${{ secrets.CNB_TOKEN_USER_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cnb_url="${CNB_REPO_URL_HTTPS:-https://cnb.cool/axlmc/Axolotl.git}"
          token_user="${CNB_TOKEN_USER_NAME:-cnb}"
          auth="$(printf '%s:%s' "$token_user" "$CNB_TOKEN" | base64 -w0)"
          git_cnb() {
            git -c "http.extraHeader=Authorization: Basic $auth" "$@"
          }

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git_cnb push "$cnb_url" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

          node scripts/axolotl/cnb-release.mjs finalize "${RELEASE_TAG}" cnb-release/final
          node scripts/axolotl/verify-update-manifest.mjs \
            cnb-release/final/latest.json "${RELEASE_TAG}" cnb
