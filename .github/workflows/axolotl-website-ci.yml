name: Axolotl website CI

on:
  push:
    branches: [ymcl-dev]
    paths:
      - 'apps/website/**'
      - 'packages/ui/**'
      - 'packages/assets/**'
      - 'packages/api-client/**'
      - 'packages/utils/**'
      - 'packages/tooling-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/axolotl-website-ci.yml'
  pull_request:
    branches: [ymcl-dev]
    paths:
      - 'apps/website/**'
      - 'packages/ui/**'
      - 'packages/assets/**'
      - 'packages/api-client/**'
      - 'packages/utils/**'
      - 'packages/tooling-config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/axolotl-website-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axolotl-website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter @axolotl/website build
